  <header class="topbar">
    <button class="icon-btn" id="btnMenu" data-i18n-aria="aria.menu"><svg class="ic"><use href="#i-menu"/></svg></button>
    <div class="brand">
      <span class="seal" aria-hidden="true">象棋</span>
      <div class="brand-text">
        <h1 class="brand-title" data-i18n="app.title">楚河漢界</h1>
        <p class="brand-sub" id="modeLabel">人機對弈</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnMusic" aria-pressed="false" data-i18n-aria="aria.music"><svg class="ic"><use href="#i-music"/></svg></button>
      <button class="icon-btn" id="btnSound" aria-pressed="true" data-i18n-aria="aria.sound"><svg class="ic"><use href="#i-sound"/></svg></button>
      <button class="icon-btn" id="btnSettings" data-i18n-aria="aria.settings"><svg class="ic"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <section class="board-col">
      <div class="player-card" id="cardTop">
        <div class="avatar black">將</div>
        <div class="p-main"><div class="p-name"></div><div class="p-sub"></div></div>
        <div class="clock" hidden>0:00</div>
      </div>
      <div class="board-row">
        <div class="evalbar" id="evalBar" hidden><div class="evalbar-fill" id="evalFill"></div></div>
        <div class="board-wrap" id="boardWrap">
          <canvas id="board" role="img" data-i18n-aria="aria.board"></canvas>
          <div class="board-banner" id="banner" aria-live="assertive"></div>
        </div>
      </div>
      <div class="player-card" id="cardBottom">
        <div class="avatar red">帥</div>
        <div class="p-main"><div class="p-name"></div><div class="p-sub"></div></div>
        <div class="clock" hidden>0:00</div>
      </div>
      <div class="skill-bar" id="skillBar" hidden></div>
      <div class="status" id="statusLine" aria-live="polite"></div>
    </section>

    <aside class="ledger" id="ledger">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="ledger-head"><b data-i18n="ledger.title">棋譜與分析</b><button class="icon-btn" id="ledgerClose" data-i18n-aria="btn.close"><svg class="ic"><use href="#i-close"/></svg></button></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="moves" aria-selected="true" data-i18n="tab.moves">棋譜</button>
        <button role="tab" data-tab="analysis" aria-selected="false" data-i18n="tab.analysis">分析</button>
        <button role="tab" data-tab="info" aria-selected="false" data-i18n="tab.info">對局</button>
      </div>
      <div class="tabpanel" id="tab-moves" role="tabpanel">
        <p class="opening" id="openingName"></p>
        <ol class="movelist" id="moveList"></ol>
      </div>
      <div class="tabpanel" id="tab-analysis" role="tabpanel" hidden>
        <div class="row"><label class="row-label" for="anToggle" data-i18n="an.engine">引擎分析</label><span class="switch"><input type="checkbox" id="anToggle"><span></span></span></div>
        <div class="row"><label class="row-label" for="arrowToggle" data-i18n="an.showArrow">在棋盤上標示最佳著法</label><span class="switch"><input type="checkbox" id="arrowToggle"><span></span></span></div>
        <div class="an-section" id="anBody"></div>
        <div class="an-section"><h3 data-i18n="an.reviewTitle">全局分析</h3><div id="reviewBody"></div></div>
        <div class="an-section" id="explainBox" hidden>
          <h3 data-i18n="cl.title">請 Claude 講棋</h3>
          <p class="an-meta" data-i18n="cl.note"></p>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn small" id="explainBtn"><svg class="ic"><use href="#i-spark"/></svg><span data-i18n="cl.ask">講解這個局面</span></button>
            <button class="btn small ghost" id="explainStop" hidden data-i18n="cl.stop">停止</button>
          </div>
          <div class="an-pv" id="explainOut" hidden style="white-space:pre-wrap;font:14px/1.75 var(--font-body);margin-top:8px"></div>
        </div>
      </div>
      <div class="tabpanel" id="tab-info" role="tabpanel" hidden></div>
      <div class="navbar">
        <button id="navFirst" data-i18n-aria="nav.first"><svg class="ic"><use href="#i-first"/></svg></button>
        <button id="navPrev" data-i18n-aria="nav.prev"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button id="navPlay" data-i18n-aria="nav.play"><svg class="ic"><use href="#i-play"/></svg></button>
        <button id="navNext" data-i18n-aria="nav.next"><svg class="ic"><use href="#i-next"/></svg></button>
        <button id="navLast" data-i18n-aria="nav.last"><svg class="ic"><use href="#i-last"/></svg></button>
      </div>
    </aside>
  </main>

  <nav class="toolbar" id="toolbar">
    <button class="tool" id="tNew" data-i18n-aria="tool.new"><svg class="ic"><use href="#i-new"/></svg><span data-i18n="tool.new">新局</span></button>
    <button class="tool" id="tUndo" data-i18n-aria="tool.undo"><svg class="ic"><use href="#i-undo"/></svg><span data-i18n="tool.undo">悔棋</span></button>
    <button class="tool primary" id="tHint" data-i18n-aria="tool.hint"><svg class="ic"><use href="#i-hint"/></svg><span data-i18n="tool.hint">提示</span></button>
    <button class="tool" id="tFlip" data-i18n-aria="tool.flip"><svg class="ic"><use href="#i-flip"/></svg><span data-i18n="tool.flip">翻轉</span></button>
    <button class="tool" id="tDraw" data-i18n-aria="tool.draw"><svg class="ic"><use href="#i-draw"/></svg><span data-i18n="tool.draw">求和</span></button>
    <button class="tool" id="tResign" data-i18n-aria="tool.resign"><svg class="ic"><use href="#i-flag"/></svg><span data-i18n="tool.resign">認輸</span></button>
    <button class="tool mobile-only" id="tLedger" data-i18n-aria="tool.ledger"><svg class="ic"><use href="#i-list"/></svg><span data-i18n="tool.ledger">棋譜</span></button>
  </nav>
  <div class="editor-bar" id="editorBar" hidden></div>
</div>

<template id="drawerTpl">
  <aside class="drawer">
    <div class="drawer-head"><span class="seal" aria-hidden="true">象棋</span><b class="brand-title" data-i18n="app.title">楚河漢界</b></div>
    <nav>
      <button class="drawer-item" data-menu="new"><svg class="ic"><use href="#i-new"/></svg><span><span data-i18n="menu.new"></span><small data-i18n="menu.newSub"></small></span></button>
      <button class="drawer-item" data-menu="puzzles"><svg class="ic"><use href="#i-target"/></svg><span><span data-i18n="menu.puzzles"></span><small data-count="menu.puzzlesSub"></small></span></button>
      <button class="drawer-item" data-menu="analysis"><svg class="ic"><use href="#i-chart"/></svg><span><span data-i18n="menu.analysis"></span><small data-i18n="menu.analysisSub"></small></span></button>
      <button class="drawer-item" data-menu="edit"><svg class="ic"><use href="#i-grid"/></svg><span><span data-i18n="menu.edit"></span><small data-i18n="menu.editSub"></small></span></button>
      <button class="drawer-item" data-menu="skills"><svg class="sk-ic menu-sk"><use href="#sk-thunder"/></svg><span><span data-i18n="menu.skills"></span><small data-i18n="menu.skillsSub"></small></span></button>
      <div class="drawer-sep"></div>
      <button class="drawer-item" data-menu="import"><svg class="ic"><use href="#i-import"/></svg><span><span data-i18n="menu.import"></span><small data-i18n="menu.importSub"></small></span></button>
      <button class="drawer-item" data-menu="export"><svg class="ic"><use href="#i-share"/></svg><span><span data-i18n="menu.export"></span><small data-i18n="menu.exportSub"></small></span></button>
      <button class="drawer-item" data-menu="library"><svg class="ic"><use href="#i-book"/></svg><span><span data-i18n="menu.library"></span><small data-i18n="menu.librarySub"></small></span></button>
      <button class="drawer-item" data-menu="stats"><svg class="ic"><use href="#i-stats"/></svg><span><span data-i18n="menu.stats"></span><small data-i18n="menu.statsSub"></small></span></button>
      <div class="drawer-sep"></div>
      <button class="drawer-item" data-menu="settings"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="menu.settings"></span></button>
      <button class="drawer-item" data-menu="help"><svg class="ic"><use href="#i-help"/></svg><span data-i18n="menu.help"></span></button>
      <button class="drawer-item" data-menu="install"><svg class="ic"><use href="#i-phone"/></svg><span data-i18n="menu.install"></span></button>
      <button class="drawer-item" data-menu="about"><svg class="ic"><use href="#i-info"/></svg><span data-i18n="menu.about"></span></button>
    </nav>
  </aside>
</template>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>
